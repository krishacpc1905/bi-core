<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title description">
  <title id="title">10,000-edge batch speedup by thread count</title>
  <desc id="description">Insertion and deletion speedups stay below one for all tested thread counts; more threads do not improve the measured query time.</desc>
  <rect width="760" height="450" fill="white"/>
  <text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">10,000-edge batch speedup by thread count</text>
  <text x="380" y="49" text-anchor="middle" font-family="sans-serif" font-size="12">Sequential median / parallel median (higher is better)</text>
  <line x1="90" y1="350" x2="680" y2="350" stroke="#333"/>
  <line x1="90" y1="90" x2="90" y2="350" stroke="#333"/>
  <line x1="90" y1="90" x2="680" y2="90" stroke="#999" stroke-dasharray="5 4"/>
  <text x="80" y="354" text-anchor="end" font-family="sans-serif" font-size="11">0.90</text>
  <text x="80" y="289" text-anchor="end" font-family="sans-serif" font-size="11">0.93</text>
  <text x="80" y="224" text-anchor="end" font-family="sans-serif" font-size="11">0.96</text>
  <text x="80" y="159" text-anchor="end" font-family="sans-serif" font-size="11">0.99</text>
  <text x="80" y="94" text-anchor="end" font-family="sans-serif" font-size="11">1.02</text>
  <line x1="90" y1="285" x2="680" y2="285" stroke="#ddd"/>
  <line x1="90" y1="220" x2="680" y2="220" stroke="#ddd"/>
  <line x1="90" y1="155" x2="680" y2="155" stroke="#ddd"/>
  <text x="385" y="405" text-anchor="middle" font-family="sans-serif" font-size="13">OpenMP threads</text>
  <text x="22" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" transform="rotate(-90 22 220)">Speedup</text>
  <g font-family="sans-serif" font-size="11" text-anchor="middle">
    <text x="110" y="370">1</text>
    <text x="250" y="370">2</text>
    <text x="390" y="370">4</text>
    <text x="530" y="370">8</text>
    <text x="670" y="370">20</text>
  </g>
  <polyline points="110,155 250,149 390,214 530,210 670,201" fill="none" stroke="#1769aa" stroke-width="3"/>
  <polyline points="110,207 250,222 390,235 530,237 670,296" fill="none" stroke="#c43b3b" stroke-width="3"/>
  <g fill="#1769aa">
    <circle cx="110" cy="155" r="4"/><circle cx="250" cy="149" r="4"/><circle cx="390" cy="214" r="4"/><circle cx="530" cy="210" r="4"/><circle cx="670" cy="201" r="4"/>
  </g>
  <g fill="#c43b3b">
    <circle cx="110" cy="207" r="4"/><circle cx="250" cy="222" r="4"/><circle cx="390" cy="235" r="4"/><circle cx="530" cy="237" r="4"/><circle cx="670" cy="296" r="4"/>
  </g>
  <line x1="255" y1="430" x2="285" y2="430" stroke="#1769aa" stroke-width="3"/>
  <text x="292" y="434" font-family="sans-serif" font-size="12">Insertion</text>
  <line x1="390" y1="430" x2="420" y2="430" stroke="#c43b3b" stroke-width="3"/>
  <text x="427" y="434" font-family="sans-serif" font-size="12">Deletion</text>
</svg>
